spring.application.name=demo
spring.config.import=optional:file:.env[.properties]
server.port=8080


spring.datasource.url=jdbc:mysql://localhost:3306/campusconnect
spring.datasource.username=root
spring.datasource.password=Adi@mysql123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Show readable error messages to the frontend
server.error.include-message=always

# College admin, created once on first startup (values come from .env)
app.admin.name=${ADMIN_NAME:College Admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Razorpay (use TEST keys from the Razorpay dashboard; values come from .env)
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
